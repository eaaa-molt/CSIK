<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cloud ID — Conditional Access Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────── */
:root {
  --accent:         #0078d4;
  --accent-h:       #106ebe;
  --accent-light:   #deecf9;
  --sidebar:        #1a2433;
  --sidebar-t:      #c8d3e0;
  --sidebar-icon:   #7a95af;
  --sidebar-act:    #60a5fa;
  --sidebar-act-bg: rgba(96,165,250,.15);
  --bg:             #f3f2f1;
  --surface:        #ffffff;
  --surface2:       #faf9f8;
  --t1:             #323130;
  --t2:             #605e5c;
  --t3:             #a19f9d;
  --border:         #edebe9;
  --border2:        #c8c6c4;
  --ok:             #107c10;
  --ok-bg:          #dff6dd;
  --err:            #a4262c;
  --err-bg:         #fde7e9;
  --warn:           #d83b01;
  --warn-bg:        #fff4ce;
  --info:           #7160e8;
  --info-bg:        #f0effe;
  --topbar-h:       48px;
  --sidebar-w:      224px;
  --radius:         4px;
  --shadow:         0 2px 8px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #1a1a1a;
    --surface:  #252525;
    --surface2: #2d2d2d;
    --t1:       #f3f2f1;
    --t2:       #a19f9d;
    --t3:       #605e5c;
    --border:   #3b3a39;
    --border2:  #605e5c;
    --ok:       #6ccb6c;
    --ok-bg:    #0a2e0a;
    --err:      #f1707b;
    --err-bg:   #3a0d10;
    --warn:     #f7a948;
    --warn-bg:  #2e1e00;
    --info:     #a99cf5;
    --info-bg:  #1e1840;
    --accent-light: #002848;
    --shadow:   0 2px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg:       #1a1a1a;
  --surface:  #252525;
  --surface2: #2d2d2d;
  --t1:       #f3f2f1;
  --t2:       #a19f9d;
  --t3:       #605e5c;
  --border:   #3b3a39;
  --border2:  #605e5c;
  --ok:       #6ccb6c;
  --ok-bg:    #0a2e0a;
  --err:      #f1707b;
  --err-bg:   #3a0d10;
  --warn:     #f7a948;
  --warn-bg:  #2e1e00;
  --info:     #a99cf5;
  --info-bg:  #1e1840;
  --accent-light: #002848;
  --shadow:   0 2px 8px rgba(0,0,0,.35);
}
/* ── Reset & Base ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  color: var(--t1);
  background: var(--bg);
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; font-family: inherit; font-size: 14px; border: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* ── App Shell ───────────────────────────────────────────────────────────── */
#app { display: flex; height: 100vh; overflow: hidden; }
/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 200;
}
.sidebar-logo {
  padding: 0 16px;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.sidebar-logo-icon {
  width: 24px; height: 24px;
  background: var(--accent);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sidebar-logo-icon svg { width: 16px; height: 16px; fill: white; }
.sidebar-logo-text { color: white; font-weight: 600; font-size: 13px; white-space: nowrap; }
.sidebar-logo-sub { color: rgba(255,255,255,.5); font-size: 10px; font-weight: 400; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }
.nav-section-label {
  padding: 16px 16px 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--sidebar-icon);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  color: var(--sidebar-t);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 0;
  transition: background .12s;
  border-left: 3px solid transparent;
  user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,.06); }
.nav-item.active {
  color: var(--sidebar-act);
  background: var(--sidebar-act-bg);
  border-left-color: var(--sidebar-act);
}
.nav-item svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; opacity: .8; }
.nav-item.active svg { opacity: 1; }
.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  line-height: 16px;
}
/* Sidebar bottom: user switcher */
.sidebar-bottom {
  border-top: 1px solid rgba(255,255,255,.08);
  padding: 12px;
  flex-shrink: 0;
}
.user-switcher-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--sidebar-icon);
  margin-bottom: 6px;
}
.user-switcher-select {
  width: 100%;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  color: var(--sidebar-t);
  border-radius: var(--radius);
  padding: 6px 8px;
  font-size: 12px;
}
.user-switcher-select option { background: #1a2433; color: #c8d3e0; }
/* ── Main area ───────────────────────────────────────────────────────────── */
#main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* ── Top bar ─────────────────────────────────────────────────────────────── */
#topbar {
  height: var(--topbar-h);
  min-height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 8px;
  z-index: 100;
  flex-shrink: 0;
}
.topbar-crumb {
  color: var(--t2);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.topbar-crumb span { color: var(--t1); font-weight: 500; }
.topbar-spacer { flex: 1; }
.tenant-chip {
  font-size: 12px;
  color: var(--t2);
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tenant-chip strong { color: var(--t1); }
.theme-toggle {
  width: 32px; height: 32px;
  border-radius: var(--radius);
  background: transparent;
  border: 1px solid var(--border);
  color: var(--t2);
  display: flex; align-items: center; justify-content: center;
  transition: background .12s;
}
.theme-toggle:hover { background: var(--surface2); }
.theme-toggle svg { width: 16px; height: 16px; fill: currentColor; }
/* ── Page content ────────────────────────────────────────────────────────── */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 28px 48px;
}
.page-header {
  margin-bottom: 24px;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--t1);
  text-wrap: balance;
}
.page-subtitle {
  font-size: 13px;
  color: var(--t2);
  margin-top: 2px;
}
/* ── Cards ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title { font-weight: 600; font-size: 14px; }
.card-body { padding: 20px; }
/* ── Stat tiles ──────────────────────────────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-value {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.stat-label { font-size: 12px; color: var(--t2); font-weight: 500; }
.stat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}
/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius);
  font-weight: 500;
  font-size: 14px;
  transition: background .12s, color .12s;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: var(--accent-h); }
.btn-secondary {
  background: var(--surface);
  color: var(--t1);
  border: 1px solid var(--border2);
}
.btn-secondary:hover { background: var(--surface2); }
.btn-danger { background: var(--err); color: white; }
.btn-danger:hover { background: #8a1f24; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
/* ── Badges ──────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.badge-enabled  { background: var(--ok-bg);   color: var(--ok); }
.badge-disabled { background: var(--bg);       color: var(--t3); border: 1px solid var(--border2); }
.badge-report   { background: var(--info-bg);  color: var(--info); }
.badge-block    { background: var(--err-bg);   color: var(--err); }
.badge-grant    { background: var(--ok-bg);    color: var(--ok); }
.badge-mfa      { background: var(--warn-bg);  color: var(--warn); }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
/* ── Tables ──────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  text-align: left;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 12px;
  color: var(--t2);
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  white-space: nowrap;
}
td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--t1);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface2); }
.td-name { font-weight: 500; }
/* ── Command bar ─────────────────────────────────────────────────────────── */
.cmd-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.cmd-bar-right { margin-left: auto; }
/* ── Forms ───────────────────────────────────────────────────────────────── */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--t1);
  margin-bottom: 4px;
}
.form-label-hint { font-weight: 400; color: var(--t2); font-size: 12px; margin-left: 4px; }
.form-input, .form-select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 7px 10px;
  color: var(--t1);
  transition: border-color .12s;
}
.form-input:focus, .form-select:focus {
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 2px var(--accent-light);
}
.form-select option { background: var(--surface); color: var(--t1); }
.radio-group, .check-group { display: flex; flex-direction: column; gap: 6px; }
.radio-item, .check-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background .12s;
}
.radio-item:hover, .check-item:hover { background: var(--surface2); }
.radio-item.selected, .check-item.selected {
  background: var(--accent-light);
  border-color: var(--accent);
}
.radio-item input, .check-item input { margin-top: 2px; accent-color: var(--accent); }
.radio-item label, .check-item label {
  font-size: 13px;
  cursor: pointer;
  flex: 1;
}
.radio-item label small, .check-item label small {
  display: block;
  color: var(--t2);
  font-size: 12px;
  font-weight: 400;
}
.state-toggle { display: flex; gap: 8px; }
.state-btn {
  flex: 1;
  padding: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--t2);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
  transition: all .12s;
}
.state-btn:hover { background: var(--surface2); }
.state-btn.active-enabled  { border-color: var(--ok);   background: var(--ok-bg);   color: var(--ok); }
.state-btn.active-report   { border-color: var(--info); background: var(--info-bg); color: var(--info); }
.state-btn.active-disabled { border-color: var(--border2); background: var(--surface); color: var(--t1); }
/* ── Tag pills for selections ────────────────────────────────────────────── */
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--accent-light);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 500;
}
.tag-pill button {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 14px;
  line-height: 1;
  padding: 0;
  margin-left: 2px;
}
/* ── Slide-in panel ──────────────────────────────────────────────────────── */
#panel-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
#panel-overlay.open { opacity: 1; pointer-events: all; }
#policy-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 520px;
  max-width: 100vw;
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 600;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .22s ease;
  box-shadow: -4px 0 24px rgba(0,0,0,.15);
}
#policy-panel.open { transform: translateX(0); }
.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.panel-title { font-weight: 700; font-size: 16px; flex: 1; }
.panel-close {
  width: 28px; height: 28px;
  border-radius: var(--radius);
  background: none;
  border: 1px solid var(--border);
  color: var(--t2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: background .12s;
}
.panel-close:hover { background: var(--surface2); }
.panel-body { flex: 1; overflow-y: auto; padding: 20px; }
.panel-body::-webkit-scrollbar { width: 6px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
.panel-section { margin-bottom: 24px; }
.panel-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--t1);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.panel-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-shrink: 0;
}
/* ── What If layout ──────────────────────────────────────────────────────── */
.whatif-layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 900px) { .whatif-layout { grid-template-columns: 1fr; } }
.whatif-form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: sticky;
  top: 0;
}
.whatif-results { display: flex; flex-direction: column; gap: 12px; }
/* ── Verdict banner ──────────────────────────────────────────────────────── */
.verdict {
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  border-left: 4px solid;
}
.verdict-granted { background: var(--ok-bg);  border-color: var(--ok); }
.verdict-blocked  { background: var(--err-bg); border-color: var(--err); }
.verdict-report   { background: var(--info-bg); border-color: var(--info); }
.verdict-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }
.verdict-title { font-weight: 700; font-size: 16px; }
.verdict-detail { font-size: 13px; color: var(--t2); margin-top: 2px; }
.verdict-controls { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
/* ── Policy eval card ────────────────────────────────────────────────────── */
.eval-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.eval-header {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  background: var(--surface2);
}
.eval-header:hover { background: var(--border); }
.eval-applies-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
}
.eval-applies-yes  { background: var(--ok-bg);   color: var(--ok); }
.eval-applies-no   { background: var(--bg);       color: var(--t3); border: 1px solid var(--border2); }
.eval-applies-rep  { background: var(--info-bg);  color: var(--info); }
.eval-policy-name  { font-weight: 600; font-size: 13px; flex: 1; }
.eval-chevron { font-size: 12px; color: var(--t3); transition: transform .15s; }
.eval-chevron.open { transform: rotate(90deg); }
.eval-body { padding: 0; display: none; }
.eval-body.open { display: block; }
.eval-step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.eval-step:last-child { border-bottom: none; }
.step-icon { font-size: 14px; flex-shrink: 0; line-height: 1.4; }
.step-label { font-weight: 600; color: var(--t2); min-width: 110px; font-size: 12px; }
.step-detail { flex: 1; color: var(--t1); }
.step-result {
  padding: 10px 16px;
  background: var(--surface2);
  border-top: 1px solid var(--border);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}
/* ── Empty state ─────────────────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--t2);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--t1); margin-bottom: 6px; }
.empty-sub { font-size: 13px; }
/* ── Misc ────────────────────────────────────────────────────────────────── */
.text-muted { color: var(--t2); }
.text-sm    { font-size: 12px; }
.mt-1 { margin-top: 4px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 16px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.info-box {
  background: var(--info-bg);
  border: 1px solid var(--info);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--t1);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.info-box .info-icon { font-size: 16px; flex-shrink: 0; }
.grant-controls-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.cond-section { margin-top: 10px; }

      grant:{ operator:'OR', controls:['mfa'] }
    },

      users:{ includeAll:false, includeGroups:['g-executives'], includeUsers:[], excludeGroups:[], excludeUsers:[] },
      apps:{ includeAll:true, includeApps:[], excludeApps:[] },
      conditions:{ locations:{enabled:true,includeAll:true,includeLocations:[],excludeLocations:['loc-office','loc-dk']}, devicePlatforms:{enabled:false,platforms:[]}, clientApps:{enabled:false,apps:[]}, signInRisk:{enabled:false,levels:[]} },

// ════════════════════════════════════════════════════════════════════════════
// EVALUATION ENGINE
// ════════════════════════════════════════════════════════════════════════════
const CONTROL_LABELS = {
  mfa:'Kræv MFA', compliantDevice:'Kræv kompatibel enhed',
  hybridJoin:'Kræv Hybrid Azure AD-joined enhed',
  approvedApp:'Kræv godkendt klientapp',
  appProtection:'Kræv app-beskyttelsespolitik',
  block:'Blokér adgang'
};
const RISK_LABELS = { none:'Ingen', low:'Lav', medium:'Medium', high:'Høj' };
const PLATFORM_LABELS = { windows:'Windows', ios:'iOS', android:'Android', macos:'macOS', linux:'Linux' };
const CLIENT_APP_LABELS = { browser:'Browser', mobileDesktop:'Mobile/Desktop-apps', exchangeActivesync:'Exchange ActiveSync', other:'Andre klienter (ældre)' };

function findUser(id) { return db.users.find(u=>u.id===id); }
function findGroup(id) { return db.groups.find(g=>g.id===id); }
function findApp(id) { return db.apps.find(a=>a.id===id); }
function findLocation(id) { return db.namedLocations.find(l=>l.id===id); }

function isUserInScope(user, uc) {
  // Exclude first
  if (uc.excludeUsers && uc.excludeUsers.includes(user.id))
    return { ok:false, reason:'Brugeren er direkte ekskluderet fra politikken' };
  if (uc.excludeGroups) {
    for (const gid of uc.excludeGroups) {
      if (user.groups.includes(gid)) {
        return { ok:false, reason:`Ekskluderet via gruppe: ${findGroup(gid)?.name}` };
      }
    }
  }
  // Include
  if (uc.includeAll) return { ok:true, reason:'Alle brugere er inkluderet' };
  if (uc.includeUsers && uc.includeUsers.includes(user.id))
    return { ok:true, reason:'Brugeren er direkte inkluderet' };
  if (uc.includeGroups) {
    for (const gid of uc.includeGroups) {
      if (user.groups.includes(gid)) {
        return { ok:true, reason:`Inkluderet via gruppe: ${findGroup(gid)?.name}` };
      }
    }
  }
  return { ok:false, reason:'Brugeren er ikke i politikkens brugeromfang' };
}

function isAppInScope(appId, ac) {
  if (ac.includeAll) {
    if (ac.excludeApps && ac.excludeApps.includes(appId))
      return { ok:false, reason:`Appen er ekskluderet: ${findApp(appId)?.name}` };
    return { ok:true, reason:'Alle cloud-apps er inkluderet' };
  }
  if (ac.includeApps && ac.includeApps.includes(appId)) {
    return { ok:true, reason:`Appen er inkluderet: ${findApp(appId)?.name}` };
  }
  return { ok:false, reason:'Appen er ikke i politikkens appomfang' };
}

function checkConditions(conds, sc) {
  const enabled = conds.clientApps.enabled || conds.devicePlatforms.enabled ||
                  conds.locations.enabled   || conds.signInRisk.enabled;
  if (!enabled) return { ok:true, reason:'Ingen betingelser konfigureret – gælder altid' };

  // Client apps
  if (conds.clientApps.enabled && conds.clientApps.apps.length > 0) {
    if (!conds.clientApps.apps.includes(sc.clientApp)) {
      const names = conds.clientApps.apps.map(a=>CLIENT_APP_LABELS[a]||a).join(', ');
      return { ok:false, reason:`Klientapp-betingelse ikke opfyldt (kræver: ${names}; bruger: ${CLIENT_APP_LABELS[sc.clientApp]||sc.clientApp})` };
    }
  }
  // Device platforms
  if (conds.devicePlatforms.enabled && conds.devicePlatforms.platforms.length > 0) {
    if (!conds.devicePlatforms.platforms.includes(sc.devicePlatform)) {
      const names = conds.devicePlatforms.platforms.map(p=>PLATFORM_LABELS[p]||p).join(', ');
      return { ok:false, reason:`Enhedsplatform-betingelse ikke opfyldt (gælder for: ${names}; bruger: ${PLATFORM_LABELS[sc.devicePlatform]||sc.devicePlatform})` };
    }
  }
  // Sign-in risk
  if (conds.signInRisk.enabled && conds.signInRisk.levels.length > 0) {
    if (!conds.signInRisk.levels.includes(sc.signInRisk)) {
      const names = conds.signInRisk.levels.map(l=>RISK_LABELS[l]||l).join(', ');
      return { ok:false, reason:`Loginrisiko-betingelse ikke opfyldt (gælder ved: ${names}; aktuelt: ${RISK_LABELS[sc.signInRisk]||sc.signInRisk})` };
    }
  }
  // Locations
  if (conds.locations.enabled) {
    const loc = findLocation(sc.locationId);
    const lc = conds.locations;
    if (lc.includeAll) {
      if (lc.excludeLocations && lc.excludeLocations.includes(sc.locationId)) {
        return { ok:false, reason:`Lokation er ekskluderet: ${loc?.name} – politikken gælder IKKE herfra` };
      }
      return { ok:true, reason:`Alle lokationer inkluderet (ekskl. evt. undtagelser); aktuelt: ${loc?.name}` };
    }
    if (lc.includeLocations && lc.includeLocations.includes(sc.locationId)) {
      return { ok:true, reason:`Lokation er inkluderet: ${loc?.name}` };
    }
    return { ok:false, reason:`Lokation er ikke i politikkens lokationsomfang: ${loc?.name}` };
  }

  return { ok:true, reason:'Alle betingelser opfyldt' };
}

function evaluatePolicy(policy, sc) {
  const r = { policyId:policy.id, name:policy.name, state:policy.state, steps:[], applies:false, grantResult:null, reason:null };
  if (policy.state === 'disabled') {
    r.reason='Politikken er deaktiveret'; return r;
  }
  const user = findUser(sc.userId);
  // Step 1: user
  const uRes = isUserInScope(user, policy.users);
  r.steps.push({ label:'Brugeromfang', ok:uRes.ok, detail:uRes.reason });
  if (!uRes.ok) { r.reason=uRes.reason; return r; }
  // Step 2: app
  const aRes = isAppInScope(sc.appId, policy.apps);
  r.steps.push({ label:'App-omfang', ok:aRes.ok, detail:aRes.reason });
  if (!aRes.ok) { r.reason=aRes.reason; return r; }
  // Step 3: conditions
  const cRes = checkConditions(policy.conditions, sc);
  r.steps.push({ label:'Betingelser', ok:cRes.ok, detail:cRes.reason });
  if (!cRes.ok) { r.reason=cRes.reason; return r; }

  r.applies = true;
  r.grantResult = policy.grant.controls.includes('block')
    ? { type:'block', controls:[], label:'Blokér adgang' }
    : { type:'grant', controls:policy.grant.controls, operator:policy.grant.operator,
        label:policy.grant.controls.map(c=>CONTROL_LABELS[c]).join(policy.grant.operator==='AND'?' OG ':' ELLER ') };
  return r;
}

function runWhatIf(sc) {
  const user = findUser(sc.userId);
  const results = db.policies.map(p => evaluatePolicy(p, sc));
  const enabled = results.filter(r=>r.applies && r.state==='enabled');
  const reportOnly = results.filter(r=>r.applies && r.state==='reportOnly');

  let overall;
  if (enabled.some(r=>r.grantResult.type==='block')) {
    overall = { type:'blocked', title:'Adgang blokeret', detail:'En eller flere aktiverede politikker blokerer adgang.', controls:[] };
  } else {
    const required = new Set();
    for (const r of enabled) r.grantResult.controls.forEach(c=>required.add(c));
    const warnings = [];
    if (required.has('mfa') && !user.mfaRegistered) warnings.push('Brugeren har IKKE registreret MFA – login vil blive afvist');
    if (required.has('compliantDevice') && !sc.deviceCompliant) warnings.push('Enheden er IKKE kompatibel (Intune) – adgang vil blive nægtet');
    if (warnings.length) {
      overall = { type:'blocked', title:'Adgang nægtet (krav ikke opfyldt)', detail:warnings.join(' · '), controls:[] };
    } else if (required.size > 0) {
      overall = { type:'granted_controls', title:'Adgang tilladt med kontroller', detail:'Brugeren skal opfylde følgende krav:', controls:[...required] };
    } else {
      overall = { type:'granted', title:'Adgang tilladt', detail:'Ingen aktiverede politikker kræver yderligere kontrol.', controls:[] };
    }
  }

  // Log entry
  const entry = { id:`log-${Date.now()}`, ts:new Date(), sc, results, overall };
  db.signInLogs.unshift(entry);
  if (db.signInLogs.length > 100) db.signInLogs.pop();
  updateLogBadge();

  return { results, overall, reportOnly, enabled };
}

const PAGE_LABELS = { overview:'Dashboard', policies:'Politikker', whatif:'What If', locations:'Named Locations', users:'Brugere', groups:'Grupper', logs:'Sign-in logs' };

function navigate(page) {
  db.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('crumb-page').textContent = PAGE_LABELS[page] || page;
  renderPage();
}

function renderPage() {
  const el = document.getElementById('content');
  switch(db.currentPage) {
    case 'overview':  el.innerHTML = renderOverview(); break;
    case 'policies':  el.innerHTML = renderPolicies(); break;
    case 'whatif':    el.innerHTML = renderWhatIf(); break;
    case 'locations': el.innerHTML = renderLocations(); break;
    case 'users':     el.innerHTML = renderUsers(); break;
    case 'groups':    el.innerHTML = renderGroups(); break;
    case 'logs':      el.innerHTML = renderLogs(); break;
  }
  attachPageEvents();
}

function doWhatIf() {
  const sc = {
    userId:     document.getElementById('wi-user').value,
    appId:      document.getElementById('wi-app').value,
    locationId: document.getElementById('wi-location').value,
    devicePlatform: document.getElementById('wi-platform').value,
    clientApp:  document.getElementById('wi-clientapp').value,
    deviceCompliant: document.getElementById('wi-compliant').value === 'true',
    signInRisk: document.getElementById('wi-risk').value,
  };

  const { results, overall, reportOnly } = runWhatIf(sc);
  whatIfResult = { sc, results, overall, reportOnly };

  const user = findUser(sc.userId);
  const app  = findApp(sc.appId);
  const loc  = findLocation(sc.locationId);

  const verdictClass = overall.type === 'granted' ? 'verdict-granted'
                     : overall.type === 'granted_controls' ? 'verdict-granted'
                     : 'verdict-blocked';
  const verdictIcon  = overall.type.startsWith('granted') ? '✅' : '🚫';

  const allResults = results;
  const enabledApply = allResults.filter(r=>r.applies && r.state==='enabled');
  const reportApply  = allResults.filter(r=>r.applies && r.state==='reportOnly');
  const notApply     = allResults.filter(r=>!r.applies && r.state!=='disabled');
  const disabled     = allResults.filter(r=>r.state==='disabled');

  let html = `
    <div class="verdict ${verdictClass}">
      <div class="verdict-icon">${verdictIcon}</div>
      <div>
        <div class="verdict-title">${overall.title}</div>
        <div class="verdict-detail">${overall.detail}</div>
        ${overall.controls.length ? `<div class="verdict-controls">${overall.controls.map(c=>`<span class="badge badge-mfa">${CONTROL_LABELS[c]}</span>`).join('')}</div>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:6px">
        <div class="card-title">Scenarie</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-left:auto">
          <span class="badge badge-grant">${user.name}</span>
          <span class="badge badge-mfa">${app?.name}</span>
          <span class="badge">${loc?.name}</span>
          <span class="badge">${PLATFORM_LABELS[sc.devicePlatform]}</span>
          <span class="badge">${CLIENT_APP_LABELS[sc.clientApp]||sc.clientApp}</span>
          ${sc.signInRisk!=='none'?`<span class="badge badge-block">Risiko: ${RISK_LABELS[sc.signInRisk]}</span>`:''}
        </div>
      </div>
    </div>`;

  // Helper to render an eval card
  function evalCard(r) {
    const isBadge = r.applies
      ? (r.state==='reportOnly' ? '<span class="eval-applies-badge eval-applies-rep">Gælder (Report-only)</span>'
                                : '<span class="eval-applies-badge eval-applies-yes">Gælder</span>')
      : '<span class="eval-applies-badge eval-applies-no">Gælder ikke</span>';
    const badge = stateBadge(r.state);
    const cid = 'ec-'+r.policyId+'-'+Date.now();
    let steps = r.steps.map(s=>`
      <div class="eval-step">
        <span class="step-icon">${s.ok?'✔️':'✖️'}</span>
        <span class="step-label">${s.label}</span>
        <span class="step-detail">${s.detail}</span>
      </div>`).join('');
    if (!r.applies && r.state!=='disabled') {
      steps += `<div class="eval-step">
        <span class="step-icon">⛔</span>
        <span class="step-label">Årsag</span>
        <span class="step-detail" style="color:var(--err)">${r.reason}</span>
      </div>`;
    }
    const resultRow = r.applies && r.grantResult ? `
      <div class="step-result">
        <span>${r.grantResult.type==='block'?'🚫':'🔐'}</span>
        <span>${r.grantResult.label}</span>
      </div>` : '';

    return `<div class="eval-card">
      <div class="eval-header" onclick="toggleEval('${cid}')">
        <span class="eval-chevron" id="chev-${cid}">▶</span>
        <span class="eval-policy-name">${r.name}</span>
        ${badge}
        ${isBadge}
      </div>
      <div class="eval-body" id="${cid}">
        ${steps}
        ${resultRow}
      </div>
    </div>`;
  }

  if (enabledApply.length) {
    html += `<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);padding:4px 0">Aktiverede politikker der gælder (${enabledApply.length})</div>`;
    html += enabledApply.map(evalCard).join('');
  }
  if (reportApply.length) {
    html += `<div class="info-box mt-2"><span class="info-icon">ℹ️</span><div><strong>Report-only:</strong> Følgende politikker ville gælde, men blokerer ikke – de logger kun.</div></div>`;
    html += reportApply.map(evalCard).join('');
  }
  if (notApply.length) {
    html += `<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);padding:4px 0;margin-top:4px">Gælder ikke (${notApply.length})</div>`;
    html += notApply.map(evalCard).join('');
  }
  if (disabled.length) {
    html += `<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);padding:4px 0;margin-top:4px">Deaktiverede (${disabled.length})</div>`;
    html += disabled.map(evalCard).join('');
  }

  document.getElementById('wi-results').innerHTML = html;
}

function toggleEval(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById('chev-'+id);
  const open = body.classList.toggle('open');
  if (chev) chev.classList.toggle('open', open);
}

      </table>
    </div>
  </div>`;
}

function clearLogs() { db.signInLogs = []; updateLogBadge(); renderPage(); }
function fmtTime(d) {
  return d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) + ' ' +
         d.toLocaleDateString('da-DK',{day:'2-digit',month:'2-digit'});
}

let editingPolicyId = null;

function panelSave()   { _panelMode==='user' ? saveUser() : _panelMode==='location' ? saveLocation() : _panelMode==='group' ? saveGroup() : savePolicy(); }
function panelDelete() { _panelMode==='user' ? deleteUser() : _panelMode==='location' ? deleteLocation() : _panelMode==='group' ? deleteGroup() : deletePolicy(); }

function openPolicyPanel(id) {
  _panelMode = 'policy';
  editingPolicyId = id;
  if (id === 'new') {
    editingPolicy = {
      id: 'pol-'+db.nextPolicyId,
      name: 'Ny Conditional Access-politik',
      state: 'disabled',
      users:{ includeAll:true, includeGroups:[], includeUsers:[], excludeGroups:[], excludeUsers:[] },
      apps:{ includeAll:true, includeApps:[], excludeApps:[] },
      conditions:{
        locations:{enabled:false,includeAll:true,includeLocations:[],excludeLocations:[]},
        devicePlatforms:{enabled:false,platforms:[]},
        clientApps:{enabled:false,apps:[]},
        signInRisk:{enabled:false,levels:[]}
      },
      grant:{ operator:'OR', controls:[] }
    };
    document.getElementById('panel-title').textContent = 'Ny politik';
    document.getElementById('panel-delete-btn').style.display = 'none';
  } else {
    const p = db.policies.find(p=>p.id===id);
    editingPolicy = JSON.parse(JSON.stringify(p));
    document.getElementById('panel-title').textContent = p.name;
    document.getElementById('panel-delete-btn').style.display = 'inline-flex';
  }
  renderPanelBody();
  document.getElementById('policy-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
}

function closePanel() {
  document.getElementById('policy-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
  editingPolicyId = null; editingPolicy = null;
  editingUserId = null;   editingUser = null;
  editingLocationId = null; editingLocation = null;
  editingGroupId = null;  editingGroup = null;
  // Nulstil evt. halvt-bekræftet sletning
  clearTimeout(_confirmTimer);
  _confirmPending = null;
  const btn = document.getElementById('panel-delete-btn');
  if (btn) { btn.textContent = 'Slet'; btn.style.background = ''; }
}

// Panel mutation helpers
function setEditState(s) { editingPolicy.state=s; renderPanelBody(); }
function setUserInclude(v) { editingPolicy.users.includeAll=(v==='all'); renderPanelBody(); }
function setAppInclude(v) { editingPolicy.apps.includeAll=(v==='all'); renderPanelBody(); }
function setLocInclude(v) { editingPolicy.conditions.locations.includeAll=(v==='all'); renderPanelBody(); }

function removeGroup(type, id) {
  if(type==='include') editingPolicy.users.includeGroups = editingPolicy.users.includeGroups.filter(g=>g!==id);
  if(type==='exclude') editingPolicy.users.excludeGroups = editingPolicy.users.excludeGroups.filter(g=>g!==id);
  renderPanelBody();
}
function removeUser(type, id) {
  if(type==='include') editingPolicy.users.includeUsers = editingPolicy.users.includeUsers.filter(u=>u!==id);
  if(type==='exclude') editingPolicy.users.excludeUsers = editingPolicy.users.excludeUsers.filter(u=>u!==id);
  renderPanelBody();
}
function addApp(sel) {
  const v=sel.value; if(!v) return;
  if(!editingPolicy.apps.includeApps.includes(v)) editingPolicy.apps.includeApps.push(v);
  renderPanelBody();
}
function removeApp(id) {
  editingPolicy.apps.includeApps = editingPolicy.apps.includeApps.filter(a=>a!==id);
  renderPanelBody();
}
function toggleCond(type, val) { editingPolicy.conditions[type].enabled=val; renderPanelBody(); }
function toggleRisk(level, val) {
  if(val) { if(!editingPolicy.conditions.signInRisk.levels.includes(level)) editingPolicy.conditions.signInRisk.levels.push(level); }
  else editingPolicy.conditions.signInRisk.levels = editingPolicy.conditions.signInRisk.levels.filter(l=>l!==level);
  renderPanelBody();
}
function toggleClientApp(val, checked) {
  if(checked){ if(!editingPolicy.conditions.clientApps.apps.includes(val)) editingPolicy.conditions.clientApps.apps.push(val); }
  else editingPolicy.conditions.clientApps.apps = editingPolicy.conditions.clientApps.apps.filter(a=>a!==val);
  renderPanelBody();
}
function togglePlatform(val, checked) {
  if(checked){ if(!editingPolicy.conditions.devicePlatforms.platforms.includes(val)) editingPolicy.conditions.devicePlatforms.platforms.push(val); }
  else editingPolicy.conditions.devicePlatforms.platforms = editingPolicy.conditions.devicePlatforms.platforms.filter(p=>p!==val);
  renderPanelBody();
}
function toggleGrant(ctrl, checked) {
  if(ctrl==='block'){
    editingPolicy.grant.controls = checked ? ['block'] : [];
  } else {
    if(editingPolicy.grant.controls.includes('block')) return;
    if(checked){ if(!editingPolicy.grant.controls.includes(ctrl)) editingPolicy.grant.controls.push(ctrl); }
    else editingPolicy.grant.controls = editingPolicy.grant.controls.filter(c=>c!==ctrl);
  }
  renderPanelBody();
}
function addExcludedLoc(sel) {
  const v=sel.value; if(!v) return;
  if(!editingPolicy.conditions.locations.excludeLocations.includes(v)) editingPolicy.conditions.locations.excludeLocations.push(v);
  renderPanelBody();
}
function removeExcludedLoc(id) {
  editingPolicy.conditions.locations.excludeLocations = editingPolicy.conditions.locations.excludeLocations.filter(l=>l!==id);
  renderPanelBody();
}

// Handles mixed "user:xxx" values from either the include or exclude dropdown
function addGroup(type, sel) {
  const v = sel.value; if(!v) return;
  if (v.startsWith('user:')) {
    const uid = v.slice(5);
    if(type==='include' && !editingPolicy.users.includeUsers.includes(uid)) editingPolicy.users.includeUsers.push(uid);
    if(type==='exclude' && !editingPolicy.users.excludeUsers.includes(uid)) editingPolicy.users.excludeUsers.push(uid);
  } else {
    if(type==='include' && !editingPolicy.users.includeGroups.includes(v)) editingPolicy.users.includeGroups.push(v);
    if(type==='exclude' && !editingPolicy.users.excludeGroups.includes(v)) editingPolicy.users.excludeGroups.push(v);
  }
  renderPanelBody();
}

function savePolicy() {
  const p = editingPolicy;
  if (!p.name.trim()) { showToast('Politiknavnet må ikke være tomt', 'error'); return; }
  const idx = db.policies.findIndex(x=>x.id===p.id);
  if (idx >= 0) {
    db.policies[idx] = p;
  } else {
    db.nextPolicyId++;
    db.policies.push(p);
  }
  updateNavBadge();
  closePanel();
  renderPage();
}

function deletePolicy() {
  panelConfirm(`Slet politikken "${editingPolicy.name}"?`, () => {
    db.policies = db.policies.filter(p=>p.id!==editingPolicy.id);
    updateNavBadge();
    closePanel();
    renderPage();
  });
}

// USER PANEL
// ════════════════════════════════════════════════════════════════════════════
let editingUserId = null;
let editingUser = null;
let _nextUserId = 100;

function openUserPanel(id) {
  _panelMode = 'user';
  editingUserId = id;
  if (id === 'new') {
    editingUser = {
      id: 'u-custom-' + (_nextUserId++),
      name: '',
      email: '',
      dept: '',
      role: '',
      groups: ['g-all'],
      mfaRegistered: false,
      deviceCompliant: false,
      guestUser: false,
      isAdmin: false,
    };
    document.getElementById('panel-title').textContent = 'Ny bruger';
    document.getElementById('panel-delete-btn').style.display = 'none';
  } else {
    const u = db.users.find(u=>u.id===id);
    editingUser = JSON.parse(JSON.stringify(u));
    document.getElementById('panel-title').textContent = u.name || 'Rediger bruger';
    document.getElementById('panel-delete-btn').style.display = 'inline-flex';
  }
  renderUserPanelBody();
  document.getElementById('policy-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
}

function renderUserPanelBody() {
  const u = editingUser;
  document.getElementById('panel-body').innerHTML = `
    <div class="panel-section">
      <div class="panel-section-title">Identitet</div>
      <div class="form-group">
        <label class="form-label">Fulde navn</label>
        <input type="text" class="form-input" id="ue-name" value="${u.name}" placeholder="f.eks. Mads Kristensen"
          oninput="editingUser.name=this.value;document.getElementById('panel-title').textContent=this.value||'Ny bruger'">
      </div>
      <div class="form-group">
        <label class="form-label">E-mailadresse</label>
        <input type="email" class="form-input" id="ue-email" value="${u.email}" placeholder="f.eks. mads@contoso.com"
          oninput="editingUser.email=this.value">
      </div>
      <div class="form-group">
        <label class="form-label">Afdeling</label>
        <input type="text" class="form-input" id="ue-dept" value="${u.dept}" placeholder="f.eks. Økonomi"
          oninput="editingUser.dept=this.value">
      </div>
      <div class="form-group">
        <label class="form-label">Jobtitel</label>
        <input type="text" class="form-input" id="ue-role" value="${u.role}" placeholder="f.eks. Revisor"
          oninput="editingUser.role=this.value">
      </div>
      <div class="form-group">
        <label class="form-label">Brugertype</label>
        <div class="state-toggle">
          <button class="state-btn ${!u.guestUser?'active-enabled':''}" onclick="setUserType(false)">Intern medarbejder</button>
          <button class="state-btn ${u.guestUser?'active-report':''}" onclick="setUserType(true)">Gæstebruger (B2B)</button>
        </div>
        ${u.guestUser ? '<div class="info-box mt-2" style="font-size:12px"><span class="info-icon">ℹ️</span><div>Gæstebrugere tilføjes automatisk til gruppen "Guests" og fjernes fra "All Users".</div></div>' : ''}
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Gruppemedlemskaber</div>
      <div class="check-group">
        ${db.groups.map(g => {
          const isMember = u.groups.includes(g.id);
          const isLocked = (g.id === 'g-all' && !u.guestUser) || (g.id === 'g-guests' && u.guestUser);
          return `<label class="check-item ${isMember ? 'selected' : ''}" ${isLocked ? 'style="opacity:.6"' : ''}>
            <input type="checkbox" ${isMember ? 'checked' : ''} ${isLocked ? 'disabled' : ''}
              onchange="toggleUserGroup('${g.id}', this.checked)">
            <label>${g.name} <small>${g.desc}</small></label>
          </label>`;
        }).join('')}
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Sikkerhedsstatus</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius)">
          <div>
            <div style="font-weight:600;font-size:13px">MFA registreret</div>
            <div style="font-size:12px;color:var(--t2)">Brugeren har registreret en MFA-metode (Authenticator, SMS m.m.)</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" ${u.mfaRegistered ? 'checked' : ''} onchange="editingUser.mfaRegistered=this.checked">
            <span class="toggle-track"></span>
          </label>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius)">
          <div>
            <div style="font-weight:600;font-size:13px">Kompatibel enhed</div>
            <div style="font-size:12px;color:var(--t2)">Enheden er Intune-tilmeldt og opfylder compliance-politikker</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" ${u.deviceCompliant ? 'checked' : ''} onchange="editingUser.deviceCompliant=this.checked">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
    </div>
  `;
}

function setUserType(isGuest) {
  editingUser.guestUser = isGuest;
  if (isGuest) {
    editingUser.groups = editingUser.groups.filter(g => g !== 'g-all' && g !== 'g-employees');
    if (!editingUser.groups.includes('g-guests')) editingUser.groups.push('g-guests');
  } else {
    editingUser.groups = editingUser.groups.filter(g => g !== 'g-guests');
    if (!editingUser.groups.includes('g-all')) editingUser.groups.unshift('g-all');
  }
  renderUserPanelBody();
}

function toggleUserGroup(gid, checked) {
  if (checked) { if (!editingUser.groups.includes(gid)) editingUser.groups.push(gid); }
  else { editingUser.groups = editingUser.groups.filter(g => g !== gid); }
}

function saveUser() {
  if (!editingUser.name.trim()) { showToast('Brugernavn må ikke være tomt', 'error'); return; }
  if (!editingUser.email.trim()) { showToast('E-mailadresse må ikke være tom', 'error'); return; }
  const idx = db.users.findIndex(u => u.id === editingUser.id);
  if (idx >= 0) {
    db.users[idx] = editingUser;
  } else {
    db.users.push(editingUser);
  }
  // Update current user if we renamed them
  initUserSwitcher();
  closePanel();
  renderPage();
}

function deleteUser() {
  if (editingUser.id === db.currentUserId) {
    showToast('Du kan ikke slette den bruger du simulerer som — skift bruger først.', 'error');
    return;
  }
  panelConfirm(`Slet brugeren "${editingUser.name}"?`, () => {
    db.users = db.users.filter(u => u.id !== editingUser.id);
    initUserSwitcher();
    closePanel();
    renderPage();
  });
}

  if (idx >= 0) {
    db.namedLocations[idx] = editingLocation;
  } else {
    db.namedLocations.push(editingLocation);
  }
  closePanel();
  renderPage();
}

function deleteLocation() {
  const usedIn = db.policies.filter(p =>
    p.conditions.locations.enabled && (
      p.conditions.locations.includeLocations.includes(editingLocation.id) ||
      p.conditions.locations.excludeLocations.includes(editingLocation.id)

function saveGroup() {
  if (!editingGroup.name.trim()) { showToast('Gruppenavn må ikke være tomt', 'error'); return; }
  const idx = db.groups.findIndex(g => g.id === editingGroup.id);
  if (idx >= 0) {
    db.groups[idx] = editingGroup;
  } else {
    db.groups.push(editingGroup);
  }
  closePanel();
  renderPage();
}

function deleteGroup() {
  const gid = editingGroup.id;
  const memberCount = db.users.filter(u => u.groups.includes(gid)).length;
  const usedInPolicies = db.policies.filter(p =>
    (p.users.includeGroups||[]).includes(gid) || (p.users.excludeGroups||[]).includes(gid)
  );
  let msg = `Slet gruppen "${editingGroup.name}"?`;
  if (memberCount) msg += ` Den fjernes fra ${memberCount} bruger(e).`;
  if (usedInPolicies.length) msg += ` Bruges i politikker: ${usedInPolicies.map(p=>p.name).join(', ')} — fjernes også derfra.`;
  panelConfirm(msg, () => {
    db.groups = db.groups.filter(g => g.id !== gid);
    db.users.forEach(u => { u.groups = u.groups.filter(g => g !== gid); });
    db.policies.forEach(p => {
      p.users.includeGroups = (p.users.includeGroups||[]).filter(g => g !== gid);
      p.users.excludeGroups = (p.users.excludeGroups||[]).filter(g => g !== gid);
    });
    closePanel();
    renderPage();
  });
}

// ════════════════════════════════════════════════════════════════════════════
// HELPERS & LABEL RENDERERS
// ════════════════════════════════════════════════════════════════════════════
function stateBadge(state) {
  if (state==='enabled')    return '<span class="badge badge-enabled"><span class="badge-dot"></span>Aktiveret</span>';
  if (state==='reportOnly') return '<span class="badge badge-report"><span class="badge-dot"></span>Report-only</span>';
  return '<span class="badge badge-disabled">Deaktiveret</span>';
}
function grantLabel(grant) {
  if (!grant.controls.length) return '<span class="text-muted">—</span>';
  if (grant.controls.includes('block')) return '<span class="badge badge-block">Blokér</span>';
  return grant.controls.map(c=>`<span class="badge badge-mfa" style="font-size:11px">${CONTROL_LABELS[c]}</span>`).join(' ');
}
function grantBadge(gr) {
  if (gr.type==='block') return '<span class="badge badge-block">🚫 Blokér adgang</span>';
  return `<span class="badge badge-mfa">${gr.label}</span>`;
}
function usersLabel(u) {
  if (u.includeAll) {
    const excl = [...(u.excludeGroups||[]).map(g=>findGroup(g)?.name), ...(u.excludeUsers||[]).map(uid=>findUser(uid)?.name)].filter(Boolean);
    return excl.length ? `Alle (ekskl. ${excl.slice(0,2).join(', ')}${excl.length>2?'…':''})` : 'Alle brugere';
  }
  const inc = [...(u.includeGroups||[]).map(g=>findGroup(g)?.name), ...(u.includeUsers||[]).map(uid=>findUser(uid)?.name)].filter(Boolean);
  return inc.length ? inc.slice(0,2).join(', ')+(inc.length>2?'…':'') : '—';
}
function appsLabel(a) {
  if (a.includeAll) return 'Alle cloud-apps';
  return (a.includeApps||[]).map(id=>findApp(id)?.name).filter(Boolean).slice(0,2).join(', ')||'—';
}
function conditionsLabel(c) {
  const parts = [];
  if (c.signInRisk.enabled && c.signInRisk.levels.length)  parts.push('Loginrisiko');
  if (c.clientApps.enabled && c.clientApps.apps.length)   parts.push('Klientapp');
  if (c.devicePlatforms.enabled)                           parts.push('Platform');
  if (c.locations.enabled)                                 parts.push('Lokation');
  return parts.length ? parts.join(', ') : '<span class="text-muted text-sm">Ingen</span>';
}
function updateNavBadge() {
  document.getElementById('nav-badge-count').textContent = db.policies.length;
}
function updateLogBadge() {
  const el = document.getElementById('nav-badge-logs');
  if (db.signInLogs.length > 0) {
    el.textContent = db.signInLogs.length;
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const isDark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  updateThemeIcon();
}
function updateThemeIcon() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const isDark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-icon').innerHTML = isDark
    ? '<path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3z"/>'
    : '<path d="M8 12a4 4 0 100-8 4 4 0 000 8zM8 0h1v2H8V0zM0 7h2v2H0V7zm14 0h2v2h-2V7zM8 14h1v2H8v-2zM2.2 2.2l1.4 1.4-1.4 1.4-1.4-1.4 1.4-1.4zm10 0l1.4 1.4-1.4 1.4-1.4-1.4 1.4-1.4zM2.2 11.4l1.4 1.4-1.4 1.4-1.4-1.4 1.4-1.4zm10 0l1.4 1.4-1.4 1.4-1.4-1.4 1.4-1.4z"/>';
}

// EXPORT / IMPORT
// ════════════════════════════════════════════════════════════════════════════

// Which fields to include in the export snapshot
const EXPORT_FIELDS = ['policies','users','groups','namedLocations','nextPolicyId','nextGroupId'];

function exportData() {
  const snapshot = {};
  EXPORT_FIELDS.forEach(k => { if (db[k] !== undefined) snapshot[k] = db[k]; });
  snapshot._exportedAt = new Date().toISOString();
  snapshot._version = 1;

  const json = JSON.stringify(snapshot, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  // Filnavn med tidsstempel, så flere gemte filer ikke overskriver hinanden
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  const filename = `cloud-id-data-${ts}.json`;

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  showToast(`✓ Data gemt som fil: ${filename}`, 'ok');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const reader = new FileReader();
  reader.onload = function(e) {
    let snapshot;
    try {
      snapshot = JSON.parse(e.target.result);
    } catch(err) {
      showToast('Kunne ikke læse filen — er det en gyldig JSON-fil?', 'error');
      return;
    }
    if (!snapshot.policies || !snapshot.users) {
      showToast('Filen mangler "policies" eller "users" — er den eksporteret fra Cloud ID?', 'error');
      return;
    }
    EXPORT_FIELDS.forEach(k => { if (snapshot[k] !== undefined) db[k] = snapshot[k]; });
    initUserSwitcher();
    renderPage();
    showToast(`✓ Data indlæst: ${snapshot.policies.length} politikker · ${snapshot.users.length} brugere · ${(snapshot.namedLocations||[]).length} lokationer`, 'ok');
  };
  reader.onerror = () => showToast('Fejl ved læsning af filen.', 'error');
  reader.readAsText(file);
}

// Inline slet-bekræftelse — omdanner knappen i stedet for confirm()
// Brug: panelConfirm(besked, () => { /* selve slettelogikken */ });
let _confirmTimer = null;
let _confirmPending = null;
function panelConfirm(msg, action) {
  const btn = document.getElementById('panel-delete-btn');
  if (_confirmPending) {
    // Andet klik — udfør den gemte handling
    clearTimeout(_confirmTimer);
    _confirmPending = null;
    btn.textContent = 'Slet';
    btn.style.background = '';
    action();
    return;
  }
  // Første klik — vis bekræftelse og gem handling
  _confirmPending = action;
  btn.textContent = 'Bekræft sletning?';
  btn.style.background = 'var(--err)';
  showToast(msg + '  Klik igen for at bekræfte.', 'error');
  clearTimeout(_confirmTimer);
  _confirmTimer = setTimeout(() => {
    _confirmPending = null;
    btn.textContent = 'Slet';
    btn.style.background = '';
  }, 4000);
}

function showToast(msg, type) {
  let t = document.getElementById('toast-el');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-el';
    t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:3000;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:opacity .3s;max-width:90vw;text-align:center;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'error' ? 'var(--err-bg)' : 'var(--ok-bg)';
  t.style.color      = type === 'error' ? 'var(--err)'    : 'var(--ok)';
  t.style.border     = `1px solid ${type === 'error' ? 'var(--err)' : 'var(--ok)'}`;
  t.style.opacity = '1';
  clearTimeout(t._hide);
  t._hide = setTimeout(() => { t.style.opacity = '0'; }, 4000);
}
